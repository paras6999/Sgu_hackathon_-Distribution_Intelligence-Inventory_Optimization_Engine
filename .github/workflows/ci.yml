name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  types:
    name: types (schema -> TS + Python up to date, fixtures valid)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - run: bun run check:types
      - run: bun test packages/dia-types

  engine:
    name: engine (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --frozen
      - run: uv run --package dia-engine pytest engine/dia-engine -q -rs

  backend:
    name: backend (bun test + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - run: bun install --frozen-lockfile
      - run: bun test apps/dia-backend
      - run: bunx tsc --noEmit -p apps/dia-backend

  web:
    name: web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p apps/dia-web
      - run: bun run --cwd apps/dia-web build

  e2e:
    name: e2e (backend + real engine process)
    runs-on: ubuntu-latest
    needs: [engine, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - run: uv sync --all-packages --frozen
      - run: E2E=1 bun test apps/dia-backend/test/e2e.test.ts
