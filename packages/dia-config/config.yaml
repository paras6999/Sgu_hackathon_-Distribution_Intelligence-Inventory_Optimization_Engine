# Vitaran (DIAgent) configuration. Every business parameter lives here (docs/Rules.md).
# Schema: engine/dia-engine/src/dia_engine/config.py (owner M2). Values: M4 (backup M2).
# Every parameter needs an `assumptions` entry with unit and source, or "judgment" (FR-15).

network:
  road_factor: 1.3                     # road km = haversine x factor; judgment
  candidate_depots_per_distributor: 3

