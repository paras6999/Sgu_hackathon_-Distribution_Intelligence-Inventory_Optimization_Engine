# --------------------------------------------------------------------------- category economics and demand shape
# realisation: share of MRP the brand invoices to the distributor (after GST and channel margins).
# gross_margin: (invoice - landed cost) / invoice. season: Jan..Dec multipliers.
# heat_beta: uplift per degC of daily max above 32 C. rain_cut: demand cut on a heavy-rain day (> 20 mm).
categories:
  dairy:         {realisation: 0.72, gross_margin: 0.24, disposal_inr_per_case: 60, heat_beta: 0.025, rain_cut: 0.12, season: [0.90, 0.92, 1.00, 1.12, 1.20, 1.10, 0.98, 0.95, 0.97, 1.00, 0.95, 0.91]}
  snacks:        {realisation: 0.70, gross_margin: 0.38, disposal_inr_per_case: 25, heat_beta: 0.0,   rain_cut: 0.15, season: [0.95, 0.96, 1.00, 1.00, 0.98, 0.97, 1.05, 1.05, 1.02, 1.04, 1.00, 0.98]}
  biscuits:      {realisation: 0.72, gross_margin: 0.30, disposal_inr_per_case: 25, heat_beta: 0.0,   rain_cut: 0.12, season: [1.00, 0.98, 0.98, 0.97, 0.96, 1.00, 1.04, 1.04, 1.02, 1.02, 1.00, 0.99]}
  beverages:     {realisation: 0.70, gross_margin: 0.40, disposal_inr_per_case: 25, heat_beta: 0.040, rain_cut: 0.15, season: [0.78, 0.85, 1.05, 1.30, 1.40, 1.20, 0.95, 0.92, 0.95, 0.98, 0.85, 0.80]}
  staples:       {realisation: 0.80, gross_margin: 0.20, disposal_inr_per_case: 25, heat_beta: 0.0,   rain_cut: 0.10, season: [1.00, 0.98, 1.00, 0.98, 0.97, 0.98, 1.00, 1.00, 1.00, 1.03, 1.03, 1.00]}
  personal_care: {realisation: 0.68, gross_margin: 0.52, disposal_inr_per_case: 25, heat_beta: 0.0,   rain_cut: 0.10, season: [0.98, 0.98, 1.00, 1.02, 1.03, 1.00, 0.98, 0.98, 1.00, 1.02, 1.01, 1.00]}
  home_care:     {realisation: 0.70, gross_margin: 0.42, disposal_inr_per_case: 25, heat_beta: 0.0,   rain_cut: 0.10, season: [0.97, 0.97, 1.00, 1.00, 0.98, 0.98, 0.98, 0.98, 1.00, 1.10, 1.04, 0.98]}

demand:
  volume_scale: 2.5                    # x base_cases_per_day; ~6 t ambient per distributor-week, ~Rs 4 cr/yr turnover each
  weekday_profile: [1.12, 1.02, 1.02, 1.02, 1.04, 1.10, 0.68]   # Mon..Sun distributor secondary sales; many GT distributors skip Sunday beats
  annual_growth: 0.06                  # FMCG volume growth; judgment
  nb_dispersion_k: 4.0                 # NB variance = mean + mean^2 / k
  history_stockout_prob: 0.05          # share of pair-days with a historical stockout (sales censored)
  unannounced_promo: {weekly_prob: 0.03, uplift: 1.30, post_dip: 0.85}
  regional_shock: {region: N, category: snacks, start: "2025-11-10", days: 14, factor: 1.25}   # NOT in events table

# Festival demand: uplift applies from `days_before` days before the festival day through the day itself.
calendar:
  festivals:
    - {name: Diwali,          dates: ["2023-11-12", "2024-11-01", "2025-10-20"], regions: [N, S, E, W], days_before: 10, uplift: {snacks: 1.50, biscuits: 1.30, beverages: 1.20, staples: 1.25, personal_care: 1.15, home_care: 1.35, dairy: 1.30}}
    - {name: Durga Puja,      dates: ["2023-10-24", "2024-10-12", "2025-10-02"], regions: [E],          days_before: 5,  uplift: {snacks: 1.40, beverages: 1.30, dairy: 1.30, biscuits: 1.20}}
    - {name: Ganesh Chaturthi, dates: ["2024-09-07", "2025-08-27"],               regions: [W],          days_before: 3,  uplift: {snacks: 1.25, dairy: 1.25, beverages: 1.15}}
    - {name: Onam,            dates: ["2024-09-15", "2025-09-05"],               regions: [S],          days_before: 5,  uplift: {staples: 1.30, dairy: 1.20, snacks: 1.20}}
    - {name: Pongal,          dates: ["2024-01-15", "2025-01-14"],               regions: [S],          days_before: 3,  uplift: {staples: 1.35, dairy: 1.25}}
    - {name: Holi,            dates: ["2024-03-25", "2025-03-14"],               regions: [N, E, W],    days_before: 3,  uplift: {beverages: 1.30, snacks: 1.30, dairy: 1.25}}
    - {name: Eid al-Fitr,     dates: ["2024-04-11", "2025-03-31"],               regions: [N, S, E, W], days_before: 3,  uplift: {dairy: 1.30, staples: 1.20, beverages: 1.15}}
    - {name: Raksha Bandhan,  dates: ["2024-08-19", "2025-08-09"],               regions: [N, S, E, W], days_before: 3,  uplift: {biscuits: 1.15, snacks: 1.15}}

supply:
  plant_output_x_base_demand: 1.05     # fixed plant output vs non-festival demand; can fall short in festival weeks (A21)
  receipt_every_days: {ambient: 7, chilled: 2}
  life_used_at_receipt: {ambient: [0.05, 0.15], chilled_days: [1, 2]}   # A8
  opening_cover_days: {ambient: 21, chilled: 4}
  distributor_storage_weeks: 3.0       # godown sized for ~3 weeks of volume; judgment
  distributor_credit_weeks: 2.0        # credit limit ~2 weeks of purchases; judgment

# --------------------------------------------------------------------------- planning
planning:
  cadence_days: {ambient: 7, chilled: 2}
  mrsl_fraction: {GT: 0.60}
  fair_share_alpha: 0.0
  critical_ratio_clip: [0.30, 0.98]
  festival_prebuild: {lookahead_days: {ambient: 14, chilled: 0}, min_factor: 1.15}
  lost_sales_breakpoints: [0, 0.10, 0.25, 0.50, 0.75, 0.90, 0.98]
  waste_breakpoints: [0, 0.10, 0.30, 0.50, 0.70, 0.90]
forecast:
  param_refit_weeks: 4
  weather_forecast_days: 7
  weather_noise: {tmax_sd_c: 2.0, rain_rel: 0.30}
costs:
  diesel_inr_per_l: 97.8
  ftl:
    AMB32:  {min_inr: 15000, fixed_inr: 8000, non_fuel_per_km_inr: 12, km_per_l: 3.5, kg: 7000, m3: 55}
    REEF17: {min_inr: 10000, fixed_inr: 6000, non_fuel_per_km_inr: 18, km_per_l: 4.0, kg: 3000, m3: 15}
  lane_rate_overrides: {}
  ptl:
    slabs: [[300, 4.5], [800, 8.0], [99999, 15.0]]
    min_charge_inr: 1500
    kg_per_m3: 250
    fuel_share: 0.5
  festival_freight_premium: {months: [9, 10, 11, 12, 1], factor: 1.20}
  stockout_penalty_x_margin: 1.2
  holding_rate_annual: 0.20
  expiry_claim_share: 1.0
carbon:
  diesel_kg_co2_per_l: 2.68
  ptl_load_factor: 0.60
  price_inr_per_kg: 0.0
simulation:
  history: ["2023-09-25", "2025-09-28"]
  test_window: ["2025-09-29", "2025-12-21"]
  seeds: 20
  delay_prob: {intra: 0.10, inter: 0.20}
  payment_lag_days: 7

# --------------------------------------------------------------------------- FR-15 assumptions (M4 completes)
assumptions:
  network.road_factor: {unit: "x haversine", source: judgment, rationale: "Indian road detour factor"}
  catalogue.distributors: {unit: "million people", source: "Census of India 2011, urban agglomeration population"}
  catalogue.size_factor: {source: judgment, rationale: "A distributor serves a few hundred outlets, so demand grows slower than city size"}
  catalogue.skus: {unit: "INR MRP, kg, m3 per case", source: judgment, rationale: "Typical Indian FMCG pack sizes and MRPs, 2025"}
  categories: {source: judgment, rationale: "Gross margins in line with listed Indian FMCG firms (dairy ~25%, personal care ~50%)"}
  demand.volume_scale: {source: judgment, rationale: "Calibrated so a distributor turns over ~Rs 4 cr/yr (inside the PRD 2.7 segment) and a weekly ambient load is close to one 32 ft truck"}
  demand.weekday_profile: {source: judgment, rationale: "GT distributors run fewer Sunday beats"}
  demand.annual_growth: {unit: "per year", source: judgment}
  demand.history_stockout_prob: {source: "Between NielsenIQ ~4% and Gruen & Corsten ~8.3% OOS rates (PRD 2.3)"}
  calendar.festivals: {source: "Published Indian festival dates 2023-2025", rationale: "Uplifts are judgment"}
  supply.plant_output_x_base_demand: {source: judgment, rationale: "A21: plant output fixed, short in festival peaks"}
  planning.mrsl_fraction.GT: {unit: "share of shelf life", source: judgment, rationale: "Typical GT minimum life on receipt"}
  costs.ftl.AMB32: {unit: "INR", source: "Least-squares fit to 8 FR8 32 ft SXL market rates (A11)"}
  costs.diesel_inr_per_l: {unit: "INR/l", source: "Upstox, Mumbai retail diesel, Oct 2026"}
  costs.stockout_penalty_x_margin: {unit: "x unit margin", source: judgment, rationale: "Goodwill factor (A16)"}
  costs.holding_rate_annual: {unit: "per year", source: "Indian working-capital rates (A18)"}
  carbon.diesel_kg_co2_per_l: {unit: "kg CO2/l", source: "Standard diesel emission factor (A22)"}
