[project]
name = "dia-types"
version = "0.1.0"
description = "Generated pydantic models for the Vitaran (DIAgent) contracts. Source: packages/dia-types/schema."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dia_types"]
