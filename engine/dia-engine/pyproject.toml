[project]
name = "dia-engine"
version = "0.1.0"
description = "Vitaran (DIAgent) decision engine: forecast, allocation MILP, simulation. Ships as a binary."
requires-python = ">=3.11,<3.13"
dependencies = [
    "dia-types",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "scipy>=1.12",
    "statsforecast>=1.7",
    "pulp>=2.8",
    "highspy>=1.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
dia-engine = "dia_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv.sources]
dia-types = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dia_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
